repos:
  # ---------------------------------------------------------------------------
  # Verificacoes basicas de qualidade
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  # ---------------------------------------------------------------------------
  # Python linting — ruff (mais rapido que flake8)
  # ---------------------------------------------------------------------------
  # rev alinhado com o ruff usado no CI e no desenvolvimento (0.16.5).
  #
  # 2026-08-29 -- bug real corrigido: o rev estava preso em v0.4.4 enquanto os
  # args ja listavam `UP045` no --ignore. Essa regra so passou a existir em
  # ruff >= 0.9 (antes era parte de UP007), entao o ruff v0.4.4 abortava com
  # "invalid value 'UP045' for '--ignore'" e exit code 2 -- o hook era
  # INCAPAZ de passar, em qualquer commit. Nao foi detectado antes porque os
  # hooks nao estavam instalados neste checkout (`.git/hooks/` so tinha os
  # .sample), entao nada rodava de verdade.
  #
  # Causa raiz da classe: select/ignore viviam DUPLICADOS aqui e em
  # ruff.toml -- duas copias da mesma regra de negocio, que a Regra 5 do
  # README proibe justamente porque divergem em silencio. Quem acrescentou
  # UP045 ao ruff.toml nao tinha como saber que existia uma segunda copia com
  # um ruff antigo atras. Os args foram REMOVIDOS: o ruff le ruff.toml da raiz
  # sozinho, que passa a ser a fonte unica de select/ignore/exclude para hook,
  # CI e execucao manual.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      # `ruff-check`, nao `ruff`: neste rev o id antigo ainda funciona mas ja
      # roda como "legacy alias" e deve sumir num release futuro.
      - id: ruff-check
        args: ['--fix']

  # ---------------------------------------------------------------------------
  # Conventional Commits — commit-msg
  # ---------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, refactor, docs, test, perf, ci, build, revert]

  # ---------------------------------------------------------------------------
  # Secret scanning — gitleaks (detect-private-key acima so pega chaves
  # PEM/SSH; o projeto lida com 7 chaves de API de provedor diferentes --
  # OPENAI/ANTHROPIC/GEMINI/XAI/OLLAMA/TAVILY/EXA -- que tem formato proprio,
  # nao coberto pelo hook generico. Achado de auditoria 2026-08-03.)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------------------
  # Hook local — verifica consistencia de MODULE_VERSION vs. test asserts
  # Captura o problema mais comum do projeto: bumpar versao e esquecer o assert
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-version-asserts
        name: Verifica asserts de versao nos testes
        entry: python scripts/check_version_asserts.py
        # language: system, nao python -- mesmo motivo do hook pip-audit
        # abaixo. 2026-08-29, bug real corrigido: com `language: python` o
        # pre-commit cria um venv ISOLADO sem as dependencias do projeto, e o
        # script importa tests/conftest.py, que importa pytest -- o hook
        # morria com ModuleNotFoundError em todo commit. Precisa do
        # interpretador real do desenvolvedor, onde as deps ja existem.
        language: system
        pass_filenames: false
        files: \.(py)$
        verbose: false

  # ---------------------------------------------------------------------------
  # Hook local — pip-audit contra vulnerabilidades conhecidas (OSV) nas
  # dependencias diretas do projeto. Superficie pequena (tinydb/pytest/
  # pytest-mock/pytest-cov/hypothesis) mas barato o suficiente para nao
  # deixar de rodar. Achado de auditoria 2026-08-03.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (vulnerabilidades de dependencias)
        entry: python -m pip_audit -r requirements.txt --strict
        language: system
        pass_filenames: false
        files: requirements\.txt$
        verbose: true
