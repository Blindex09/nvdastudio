name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint (ruff)
    # NVDAStudio e um addon do NVDA (leitor de telas Windows-only). Manter todo
    # o CI em windows-latest reproduz o ambiente real de execucao do projeto.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      # ruff.toml na raiz ja carrega select/ignore e o extend-exclude de
      # lib/ (vendorizado) e nvda_docs_cache/ (copia de referencia do NVDA).
      - name: ruff check
        run: python -m ruff check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install mypy

      - name: mypy
        run: python -m mypy addon/globalPlugins/nvdastudio

  test:
    name: Tests (pytest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Sem chaves de API no ambiente, os testes E2E que fazem chamada real a
      # provedor sao automaticamente skipados pelos proprios skip guards dos
      # modulos (ver tests/e2e/*.py). Unit + integracao rodam por completo.
      - name: pytest
        run: python -m pytest -q

      # Hook local do .pre-commit-config.yaml: pega o erro mais comum do
      # projeto (bumpar MODULE_VERSION e esquecer o assert correspondente).
      - name: Consistencia de MODULE_VERSION vs. asserts
        run: python scripts/check_version_asserts.py

  build:
    name: Build .nvda-addon
    runs-on: windows-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build addon package
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: nvdastudio-addon
          path: dist/*.nvda-addon
          if-no-files-found: error

  audit:
    name: Security audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Espelha o hook pip-audit do .pre-commit-config.yaml.
      - name: pip-audit
        run: python -m pip_audit -r requirements.txt --strict

      # NOTA: o .pre-commit-config.yaml tambem roda gitleaks localmente. Nao
      # foi promovido a step de CI aqui porque a suite de testes contem
      # fixtures SINTETICAS com formato de chave (tests/unit/test_logger.py,
      # test_api_key_validator.py, test_adversarial_robustness.py) que exigem
      # um .gitleaks.toml de allowlist antes de o scan passar limpo no CI.
