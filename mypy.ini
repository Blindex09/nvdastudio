[mypy]
python_version = 3.12
warn_unused_configs = True
explicit_package_bases = True
mypy_path = src
exclude = (?xi)(^src/nvdastudio_mcp/nvda_docs_cache/|^venv/|^\.venv/)

# Modulos que so existem dentro do processo do NVDA.
[mypy-wx.*]
ignore_missing_imports = True
[mypy-gui.*]
ignore_missing_imports = True
[mypy-ui.*]
ignore_missing_imports = True
[mypy-config.*]
ignore_missing_imports = True
[mypy-globalPluginHandler.*]
ignore_missing_imports = True
[mypy-addonHandler.*]
ignore_missing_imports = True
[mypy-scriptHandler.*]
ignore_missing_imports = True
