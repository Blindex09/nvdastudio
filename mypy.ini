[mypy]
python_version = 3.11
warn_unused_configs = True
explicit_package_bases = True
exclude = (?x)(^addon/globalPlugins/nvdastudio/lib/|^addon/globalPlugins/nvdastudio/nvda_docs_cache/|^venv/|^node_modules/)

[mypy-croniter.*]
ignore_missing_imports = True

# ---------------------------------------------------------------------------
# Modulos fornecidos pelo PROCESSO do NVDA em tempo de execucao (2026-08-29).
# Nao existem no PyPI e nao podem ser instalados num venv de dev/CI: o NVDA os
# injeta no sys.path do addon quando carrega o globalPlugin. Fora do NVDA os
# testes usam os stubs de builder/nvda_runtime_stubs.py. Sem estas secoes o
# mypy reporta 15 import-not-found que sao ruido puro, nao defeitos.
# ---------------------------------------------------------------------------
[mypy-wx.*]
ignore_missing_imports = True

[mypy-gui.*]
ignore_missing_imports = True

[mypy-ui.*]
ignore_missing_imports = True

[mypy-config.*]
ignore_missing_imports = True

[mypy-globalPluginHandler.*]
ignore_missing_imports = True

[mypy-addonHandler.*]
ignore_missing_imports = True

[mypy-scriptHandler.*]
ignore_missing_imports = True

# Dependencia OPCIONAL: context_compressor.py importa headroom dentro de um
# try/except e degrada para a compressao propria quando ausente.
[mypy-headroom.*]
ignore_missing_imports = True
